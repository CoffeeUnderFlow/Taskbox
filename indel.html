<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Box Console | CoffeeUnderFlow</title>
    <style>
        :root {
            --bg-base: #09090b;
            --card-bg: #121215;
            --border-color: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #f59e0b; /* Signature Amber/Orange */
            --accent-hover: #d97706;
            --danger: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            max-width: 520px;
            margin: 0 auto;
            padding: 20px 16px;
            line-height: 1.5;
        }

        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 14px;
            margin-bottom: 24px;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--accent);
            line-height: 1.1;
        }

        .brand-sub {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: none;
            letter-spacing: normal;
            margin-top: 2px;
        }

        .brand-sub a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .brand-sub a:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        .header-console {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: -0.01em;
            text-align: right;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .card h3 {
            font-size: 16px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-base);
            color: var(--text-main);
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--accent);
        }

        .priority-selector {
            display: flex;
            gap: 8px;
        }

        .priority-option {
            flex: 1;
            cursor: pointer;
        }

        .priority-option input {
            display: none;
        }

        .priority-badge {
            display: block;
            text-align: center;
            padding: 10px;
            background-color: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .priority-option input:checked + .priority-badge {
            background-color: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        button, input[type="submit"] {
            width: 100%;
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        button:hover, input[type="submit"]:hover {
            background-color: var(--accent-hover);
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-base);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
        }

        .task-content {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .task-prio {
            background: var(--accent);
            color: #000;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 800;
        }

        .task-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 14px;
        }

        .delete-btn {
            color: var(--danger);
            background: none;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 8px;
            width: auto;
        }

        .delete-btn:hover {
            text-decoration: underline;
            background: none;
        }

        .time-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .time-row span {
            color: var(--text-muted);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="brand-header">
        <div class="brand-title">
            TASKBOX
            <span class="brand-sub">by <a href="https://coffeeunderflow.in/" target="_blank">CoffeeUnderFlow</a></span>
        </div>
        <div class="header-console">Task Console</div>
    </div>

    <!-- Add Task Card -->
    <div class="card">
        <h3>Add New Task</h3>
        <form>
            <div class="form-group">
                <input type="text" maxlength="40" placeholder="Task description..." required>
            </div>
            <div class="form-group">
                <label>Priority Level</label>
                <div class="priority-selector">
                    <label class="priority-option">
                        <input type="radio" name="pri" value="A"><span class="priority-badge">A</span>
                    </label>
                    <label class="priority-option">
                        <input type="radio" name="pri" value="B"><span class="priority-badge">B</span>
                    </label>
                    <label class="priority-option">
                        <input type="radio" name="pri" value="C" checked><span class="priority-badge">C</span>
                    </label>
                    <label class="priority-option">
                        <input type="radio" name="pri" value="D"><span class="priority-badge">D</span>
                    </label>
                </div>
            </div>
            <input type="submit" value="Send to Box">
        </form>
    </div>

    <!-- Live Queue Card -->
    <div class="card">
        <h3>Live Queue</h3>
        <div class="task-item">
            <div class="task-content">
                <span class="task-prio">A</span>
                <span class="task-text">Drink water &amp; stretch</span>
            </div>
            <button class="delete-btn">delete</button>
        </div>
        <div class="task-item">
            <div class="task-content">
                <span class="task-prio">B</span>
                <span class="task-text">Refactor system architecture</span>
            </div>
            <button class="delete-btn">delete</button>
        </div>
    </div>

    <!-- Settings Card -->
    <div class="card">
        <h3>Device Settings</h3>
        <form>
            <div class="form-group">
                <label>Morning Alarm (Hour : Minute)</label>
                <div class="time-row">
                    <input type="number" min="0" max="23" value="07">
                    <span>:</span>
                    <input type="number" min="0" max="59" value="00">
                </div>
            </div>
            <div class="form-group">
                <label>Evening Alarm (Hour : Minute)</label>
                <div class="time-row">
                    <input type="number" min="0" max="23" value="19">
                    <span>:</span>
                    <input type="number" min="0" max="59" value="00">
                </div>
            </div>
            <input type="submit" value="Save Settings">
        </form>
    </div>

</body>
</html>
